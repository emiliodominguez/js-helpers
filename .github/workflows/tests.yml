name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn lint --max-warnings 0
      - run: yarn format:check
      - run: yarn typecheck
      - run: yarn build
      - run: yarn test:dist
      - run: yarn test:docs
      - run: yarn check:exports
      - run: yarn check:size
      - run: yarn docs

  test:
    name: Test (Node ${{ matrix.node }}, TZ ${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
        tz: [UTC]
        include:
          - node: 22
            tz: America/New_York
          - node: 22
            tz: Australia/Lord_Howe
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      # Some dev tooling (ESLint plugins, lint-staged) requires Node 22+; the library itself supports Node 20.19+.
      - run: yarn install --frozen-lockfile --ignore-engines
      - run: yarn test:coverage
